<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="192" height="48"
     viewBox="0 0 192 48"
     shape-rendering="crispEdges"
     image-rendering="pixelated">

  <title>Red Skeleton Sheet (4 frames, 48x48)</title>
  <desc>Esqueleto vermelho armado - 4 frames de caminhada/ataque</desc>

  <!-- Paleta:
       #6e3a3a vermelho sangue (armadura/capacete)
       #8e4a4a vermelho claro (highlight)
       #1a1a1a preto (contorno/detalhes internos)
       #f0d090 dourado (arma/brilho)
       #523a24 marrom escuro (alça/cinto)
  -->

  <!-- Frame 0: Pose neutra (pés juntos, arma baixa) -->
  <g transform="translate(0,0)">
    <!-- Sombra no chão -->
    <rect x="8" y="44" width="32" height="3" fill="#1a1a1a" opacity="0.35"/>

    <!-- Cabeça / capacete -->
    <rect x="18" y="6"  width="12" height="2"  fill="#1a1a1a"/>
    <rect x="16" y="8"  width="16" height="8"  fill="#6e3a3a"/>
    <rect x="18" y="10" width="4"  height="2"  fill="#8e4a4a"/>
    <rect x="26" y="10" width="2"  height="2"  fill="#8e4a4a"/>
    <!-- Fenda do capacete (olhos) -->
    <rect x="18" y="12" width="8"  height="2"  fill="#1a1a1a"/>
    <rect x="20" y="12" width="1"  height="1"  fill="#f0d090"/>
    <rect x="24" y="12" width="1"  height="1"  fill="#f0d090"/>

    <!-- Pescoço -->
    <rect x="20" y="16" width="8"  height="2"  fill="#1a1a1a"/>

    <!-- Tronco / armadura -->
    <rect x="16" y="18" width="16" height="14" fill="#6e3a3a"/>
    <rect x="18" y="20" width="4"  height="2"  fill="#8e4a4a"/>
    <rect x="26" y="20" width="2"  height="2"  fill="#8e4a4a"/>
    <!-- Cinto -->
    <rect x="16" y="30" width="16" height="2"  fill="#523a24"/>
    <rect x="22" y="30" width="4"  height="2"  fill="#f0d090"/>

    <!-- Braço esquerdo (apenas contorno ao lado do corpo) -->
    <rect x="14" y="20" width="2"  height="10" fill="#6e3a3a"/>
    <rect x="14" y="28" width="4"  height="2"  fill="#523a24"/>

    <!-- Braço direito (segura arma) -->
    <rect x="32" y="20" width="2"  height="10" fill="#6e3a3a"/>
    <rect x="32" y="30" width="4"  height="2"  fill="#523a24"/>

    <!-- Arma (espada curta) - vertical ao lado direito -->
    <rect x="38" y="22" width="2"  height="14" fill="#f0d090"/>
    <rect x="37" y="22" width="4"  height="1"  fill="#f0d090"/>
    <rect x="38" y="36" width="2"  height="2"  fill="#523a24"/>

    <!-- Pernas -->
    <rect x="18" y="32" width="4"  height="12" fill="#6e3a3a"/>
    <rect x="26" y="32" width="4"  height="12" fill="#6e3a3a"/>
    <rect x="18" y="42" width="4"  height="2"  fill="#1a1a1a"/>
    <rect x="26" y="42" width="4"  height="2"  fill="#1a1a1a"/>
  </g>

  <!-- Frame 1: Caminhando (perna direita à frente) -->
  <g transform="translate(48,0)">
    <rect x="8" y="44" width="32" height="3" fill="#1a1a1a" opacity="0.35"/>

    <!-- Cabeça levemente inclinada -->
    <rect x="19" y="6"  width="12" height="2"  fill="#1a1a1a"/>
    <rect x="17" y="8"  width="16" height="8"  fill="#6e3a3a"/>
    <rect x="19" y="10" width="4"  height="2"  fill="#8e4a4a"/>
    <rect x="27" y="10" width="2"  height="2"  fill="#8e4a4a"/>
    <rect x="19" y="12" width="8"  height="2"  fill="#1a1a1a"/>
    <rect x="21" y="12" width="1"  height="1"  fill="#f0d090"/>
    <rect x="25" y="12" width="1"  height="1"  fill="#f0d090"/>

    <rect x="21" y="16" width="8"  height="2"  fill="#1a1a1a"/>

    <!-- Tronco balança um pouco -->
    <rect x="17" y="18" width="16" height="14" fill="#6e3a3a"/>
    <rect x="19" y="20" width="4"  height="2"  fill="#8e4a4a"/>
    <rect x="27" y="20" width="2"  height="2"  fill="#8e4a4a"/>
    <rect x="17" y="30" width="16" height="2"  fill="#523a24"/>
    <rect x="23" y="30" width="4"  height="2"  fill="#f0d090"/>

    <!-- Braços oscilando -->
    <rect x="15" y="22" width="2"  height="10" fill="#6e3a3a"/>
    <rect x="15" y="30" width="4"  height="2"  fill="#523a24"/>
    <rect x="33" y="18" width="2"  height="10" fill="#6e3a3a"/>
    <rect x="33" y="28" width="4"  height="2"  fill="#523a24"/>

    <!-- Arma -->
    <rect x="39" y="20" width="2"  height="14" fill="#f0d090"/>
    <rect x="38" y="20" width="4"  height="1"  fill="#f0d090"/>
    <rect x="39" y="34" width="2"  height="2"  fill="#523a24"/>

    <!-- Pernas em passada -->
    <rect x="19" y="32" width="4"  height="10" fill="#6e3a3a"/>
    <rect x="27" y="32" width="4"  height="12" fill="#6e3a3a"/>
    <rect x="19" y="40" width="4"  height="2"  fill="#1a1a1a"/>
    <rect x="27" y="42" width="4"  height="2"  fill="#1a1a1a"/>
  </g>

  <!-- Frame 2: Atacando (braço erguido com arma) -->
  <g transform="translate(96,0)">
    <rect x="8" y="44" width="32" height="3" fill="#1a1a1a" opacity="0.35"/>

    <rect x="18" y="6"  width="12" height="2"  fill="#1a1a1a"/>
    <rect x="16" y="8"  width="16" height="8"  fill="#6e3a3a"/>
    <rect x="18" y="10" width="4"  height="2"  fill="#8e4a4a"/>
    <rect x="26" y="10" width="2"  height="2"  fill="#8e4a4a"/>
    <rect x="18" y="12" width="8"  height="2"  fill="#1a1a1a"/>
    <rect x="20" y="12" width="1"  height="1"  fill="#f0d090"/>
    <rect x="24" y="12" width="1"  height="1"  fill="#f0d090"/>

    <rect x="20" y="16" width="8"  height="2"  fill="#1a1a1a"/>

    <!-- Tronco recua um pouco -->
    <rect x="16" y="18" width="16" height="14" fill="#6e3a3a"/>
    <rect x="18" y="20" width="4"  height="2"  fill="#8e4a4a"/>
    <rect x="26" y="20" width="2"  height="2"  fill="#8e4a4a"/>
    <rect x="16" y="30" width="16" height="2"  fill="#523a24"/>
    <rect x="22" y="30" width="4"  height="2"  fill="#f0d090"/>

    <!-- Braço esquerdo normal -->
    <rect x="14" y="22" width="2"  height="10" fill="#6e3a3a"/>
    <rect x="14" y="30" width="4"  height="2"  fill="#523a24"/>

    <!-- Braço direito erguido para o alto -->
    <rect x="32" y="14" width="2"  height="6"  fill="#6e3a3a"/>
    <rect x="32" y="12" width="4"  height="2"  fill="#523a24"/>

    <!-- Arma ERGUIDA acima da cabeça -->
    <rect x="32" y="2"  width="2"  height="12" fill="#f0d090"/>
    <rect x="31" y="2"  width="4"  height="1"  fill="#f0d090"/>
    <rect x="31" y="14" width="4"  height="1"  fill="#523a24"/>

    <!-- Pernas em posição de ataque (mais abertas) -->
    <rect x="17" y="32" width="4"  height="12" fill="#6e3a3a"/>
    <rect x="27" y="32" width="4"  height="12" fill="#6e3a3a"/>
    <rect x="17" y="42" width="4"  height="2"  fill="#1a1a1a"/>
    <rect x="27" y="42" width="4"  height="2"  fill="#1a1a1a"/>
  </g>

  <!-- Frame 3: Braço descendo (frame intermediário do ataque) -->
  <g transform="translate(144,0)">
    <rect x="8" y="44" width="32" height="3" fill="#1a1a1a" opacity="0.35"/>

    <rect x="18" y="6"  width="12" height="2"  fill="#1a1a1a"/>
    <rect x="16" y="8"  width="16" height="8"  fill="#6e3a3a"/>
    <rect x="18" y="10" width="4"  height="2"  fill="#8e4a4a"/>
    <rect x="26" y="10" width="2"  height="2"  fill="#8e4a4a"/>
    <rect x="18" y="12" width="8"  height="2"  fill="#1a1a1a"/>
    <rect x="20" y="12" width="1"  height="1"  fill="#f0d090"/>
    <rect x="24" y="12" width="1"  height="1"  fill="#f0d090"/>

    <rect x="20" y="16" width="8"  height="2"  fill="#1a1a1a"/>

    <rect x="16" y="18" width="16" height="14" fill="#6e3a3a"/>
    <rect x="18" y="20" width="4"  height="2"  fill="#8e4a4a"/>
    <rect x="26" y="20" width="2"  height="2"  fill="#8e4a4a"/>
    <rect x="16" y="30" width="16" height="2"  fill="#523a24"/>
    <rect x="22" y="30" width="4"  height="2"  fill="#f0d090"/>

    <!-- Braço direito estendido para frente (golpe) -->
    <rect x="32" y="20" width="2"  height="10" fill="#6e3a3a"/>
    <rect x="34" y="24" width="4"  height="2"  fill="#523a24"/>

    <!-- Arma estendida para frente (horizontal) -->
    <rect x="36" y="24" width="10" height="2"  fill="#f0d090"/>
    <rect x="46" y="23" width="2"  height="4"  fill="#f0d090"/>

    <!-- Braço esquerdo normal -->
    <rect x="14" y="22" width="2"  height="10" fill="#6e3a3a"/>
    <rect x="14" y="30" width="4"  height="2"  fill="#523a24"/>

    <!-- Pernas levemente abertas -->
    <rect x="18" y="32" width="4"  height="12" fill="#6e3a3a"/>
    <rect x="26" y="32" width="4"  height="12" fill="#6e3a3a"/>
    <rect x="18" y="42" width="4"  height="2"  fill="#1a1a1a"/>
    <rect x="26" y="42" width="4"  height="2"  fill="#1a1a1a"/>
  </g>
</svg>