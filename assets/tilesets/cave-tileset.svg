<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="600"
     viewBox="0 0 800 600"
     shape-rendering="crispEdges"
     image-rendering="pixelated">

  <title>Caverna Sombria - Background Tileset</title>
  <desc>Fundo temático para a sala da Caverna. Paleta azul escuro/cinza fria.</desc>

  <!-- Fundo base pedra escura -->
  <rect width="800" height="600" fill="#1e2a3a"/>

  <defs>
    <!-- Padrão de pedra da caverna -->
    <pattern id="cave-floor" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#2a3644"/>
      <rect x="0" y="0" width="16" height="16" fill="#1e2a3a" opacity="0.6"/>
      <rect x="16" y="16" width="16" height="16" fill="#1e2a3a" opacity="0.6"/>
      <!-- Juntas da pedra -->
      <rect x="0" y="15" width="32" height="1" fill="#152030" opacity="0.8"/>
      <rect x="15" y="0" width="1" height="16" fill="#152030" opacity="0.6"/>
      <rect x="31" y="16" width="1" height="16" fill="#152030" opacity="0.6"/>
      <!-- Brilhos de mineral -->
      <rect x="5" y="4" width="1" height="1" fill="#5a8ab0" opacity="0.4"/>
      <rect x="22" y="10" width="1" height="1" fill="#5a8ab0" opacity="0.3"/>
      <rect x="10" y="24" width="1" height="1" fill="#5a8ab0" opacity="0.4"/>
      <rect x="26" y="28" width="1" height="1" fill="#5a8ab0" opacity="0.3"/>
    </pattern>

    <!-- Estalactite (teto) -->
    <g id="stalactite">
      <rect x="0" y="0" width="6" height="2" fill="#4a5a6a"/>
      <rect x="1" y="2" width="4" height="4" fill="#3a4a5a"/>
      <rect x="2" y="6" width="2" height="6" fill="#3a4a5a"/>
      <rect x="2" y="10" width="2" height="4" fill="#2a3a4a"/>
      <rect x="0" y="0" width="1" height="2" fill="#5a6a7a" opacity="0.6"/>
    </g>

    <!-- Estalagmite (chão) -->
    <g id="stalagmite">
      <rect x="0" y="10" width="8" height="4" fill="#4a5a6a"/>
      <rect x="1" y="6" width="6" height="4" fill="#3a4a5a"/>
      <rect x="2" y="2" width="4" height="4" fill="#3a4a5a"/>
      <rect x="3" y="0" width="2" height="2" fill="#2a3a4a"/>
      <rect x="0" y="10" width="8" height="2" fill="#5a6a7a" opacity="0.4"/>
    </g>

    <!-- Poça de água -->
    <g id="water-puddle">
      <rect x="0" y="2" width="20" height="8" fill="#1a3a55" opacity="0.7"/>
      <rect x="2" y="0" width="16" height="2" fill="#2a4a65" opacity="0.5"/>
      <rect x="2" y="10" width="16" height="2" fill="#1a3a55" opacity="0.5"/>
      <!-- Reflexo -->
      <rect x="6" y="4" width="4" height="1" fill="#5a8ab0" opacity="0.4"/>
      <rect x="10" y="6" width="3" height="1" fill="#5a8ab0" opacity="0.3"/>
    </g>

    <!-- Cristal luminoso -->
    <g id="crystal">
      <rect x="2" y="4" width="4" height="8" fill="#4a8ab8"/>
      <rect x="3" y="2" width="2" height="2" fill="#5a9ac8"/>
      <rect x="3" y="4" width="1" height="8" fill="#6ab0d8" opacity="0.7"/>
      <rect x="0" y="8" width="2" height="4" fill="#3a7aa8"/>
      <rect x="6" y="6" width="2" height="6" fill="#3a7aa8"/>
      <!-- Brilho -->
      <rect x="3" y="3" width="1" height="1" fill="#b0e0f0" opacity="0.8"/>
    </g>

    <!-- Rachadura -->
    <g id="cave-crack">
      <rect x="0" y="0" width="1" height="8" fill="#0a1520" opacity="0.7"/>
      <rect x="1" y="8" width="1" height="6" fill="#0a1520" opacity="0.6"/>
      <rect x="0" y="14" width="1" height="4" fill="#0a1520" opacity="0.5"/>
    </g>

    <!-- Musgo da caverna -->
    <g id="cave-moss">
      <rect x="0" y="0" width="12" height="4" fill="#2a4a2a" opacity="0.5"/>
      <rect x="2" y="0" width="2" height="2" fill="#3a6a3a" opacity="0.6"/>
      <rect x="6" y="0" width="2" height="2" fill="#3a6a3a" opacity="0.5"/>
    </g>
  </defs>

  <!-- Chão com padrão de pedra -->
  <rect width="800" height="600" fill="url(#cave-floor)"/>

  <!-- Paredes laterais (mais escuras, simulando profundidade) -->
  <rect x="0" y="0" width="40" height="600" fill="#0a1520" opacity="0.6"/>
  <rect x="760" y="0" width="40" height="600" fill="#0a1520" opacity="0.6"/>
  <rect x="0" y="0" width="800" height="30" fill="#0a1520" opacity="0.5"/>

  <!-- Estalactites no teto -->
  <use href="#stalactite" x="80" y="0"/>
  <use href="#stalactite" x="160" y="0"/>
  <use href="#stalactite" x="250" y="0"/>
  <use href="#stalactite" x="380" y="0"/>
  <use href="#stalactite" x="500" y="0"/>
  <use href="#stalactite" x="600" y="0"/>
  <use href="#stalactite" x="700" y="0"/>
  <use href="#stalactite" x="120" y="2"/>
  <use href="#stalactite" x="320" y="4"/>
  <use href="#stalactite" x="440" y="2"/>
  <use href="#stalactite" x="560" y="6"/>
  <use href="#stalactite" x="660" y="4"/>

  <!-- Estalagmites no chão -->
  <use href="#stalagmite" x="60" y="540"/>
  <use href="#stalagmite" x="180" y="550"/>
  <use href="#stalagmite" x="350" y="545"/>
  <use href="#stalagmite" x="500" y="540"/>
  <use href="#stalagmite" x="650" y="548"/>
  <use href="#stalagmite" x="730" y="544"/>

  <!-- Estalagmites pelo meio (obstáculos visuais) -->
  <use href="#stalagmite" x="100" y="200"/>
  <use href="#stalagmite" x="300" y="350"/>
  <use href="#stalagmite" x="600" y="250"/>
  <use href="#stalagmite" x="700" y="400"/>

  <!-- Poças de água -->
  <use href="#water-puddle" x="150" y="300"/>
  <use href="#water-puddle" x="450" y="200"/>
  <use href="#water-puddle" x="600" y="450"/>
  <use href="#water-puddle" x="250" y="480"/>

  <!-- Cristais luminosos -->
  <use href="#crystal" x="80" y="120"/>
  <use href="#crystal" x="700" y="160"/>
  <use href="#crystal" x="350" y="100"/>
  <use href="#crystal" x="550" y="380"/>
  <use href="#crystal" x="200" y="450"/>

  <!-- Rachaduras -->
  <use href="#cave-crack" x="180" y="80"/>
  <use href="#cave-crack" x="400" y="300"/>
  <use href="#cave-crack" x="620" y="180"/>
  <use href="#cave-crack" x="500" y="500"/>
  <use href="#cave-crack" x="100" y="400"/>

  <!-- Musgo nas paredes -->
  <use href="#cave-moss" x="5" y="80"/>
  <use href="#cave-moss" x="5" y="200"/>
  <use href="#cave-moss" x="5" y="350"/>
  <use href="#cave-moss" x="5" y="500"/>
  <use href="#cave-moss" x="770" y="120"/>
  <use href="#cave-moss" x="770" y="280"/>
  <use href="#cave-moss" x="770" y="440"/>

  <!-- Brilhos de mineral espalhados -->
  <rect x="120" y="150" width="2" height="2" fill="#6ab0d8" opacity="0.3"/>
  <rect x="450" y="120" width="2" height="2" fill="#6ab0d8" opacity="0.25"/>
  <rect x="680" y="300" width="2" height="2" fill="#6ab0d8" opacity="0.3"/>
  <rect x="300" y="400" width="2" height="2" fill="#6ab0d8" opacity="0.25"/>
  <rect x="550" y="500" width="2" height="2" fill="#6ab0d8" opacity="0.3"/>
  <rect x="200" y="250" width="1" height="1" fill="#b0e0f0" opacity="0.4"/>
  <rect x="650" y="350" width="1" height="1" fill="#b0e0f0" opacity="0.4"/>
</svg>